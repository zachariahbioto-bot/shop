services:
  - type: web
    name: hezora
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn shop.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hezora_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.render.com,localhost"

databases:
  - name: hezora_db
    databaseName: hezora_db
    user: hezora
    plan: free
